name: Database migrations

# Applies supabase/migrations to the hosted Supabase projects: staging first,
# then production (protect the "production" environment with a required
# reviewer in GitHub → Settings → Environments). The seed is never applied.
#
# Per environment ("staging", "production") configure:
#   variable  SUPABASE_PROJECT_REF   (20-letter project ref)
#   secret    SUPABASE_DB_PASSWORD   (database password of that project)
# Repository secret:
#   SUPABASE_ACCESS_TOKEN            (personal access token, supabase.com/dashboard/account/tokens)
#
# Until a project ref is configured the job is skipped, not failed.

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: db-migrations
  cancel-in-progress: false

jobs:
  staging:
    name: Migrate staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - id: configured
        run: |
          if [ -z "$PROJECT_REF" ]; then
            echo "::notice::staging SUPABASE_PROJECT_REF not set — skipping"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.configured.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - if: steps.configured.outputs.ok == 'true'
        name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - if: steps.configured.outputs.ok == 'true'
        name: Show pending migrations
        run: supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"
      - if: steps.configured.outputs.ok == 'true'
        name: Apply migrations
        run: supabase db push --linked --yes --password "$SUPABASE_DB_PASSWORD"

  production:
    name: Migrate production
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - id: configured
        run: |
          if [ -z "$PROJECT_REF" ]; then
            echo "::notice::production SUPABASE_PROJECT_REF not set — skipping"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.configured.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - if: steps.configured.outputs.ok == 'true'
        name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - if: steps.configured.outputs.ok == 'true'
        name: Show pending migrations
        run: supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"
      - if: steps.configured.outputs.ok == 'true'
        name: Apply migrations
        run: supabase db push --linked --yes --password "$SUPABASE_DB_PASSWORD"
